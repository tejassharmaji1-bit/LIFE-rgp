<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejas | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.7);
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --danger-red: #ff3366;
            --success-green: #00ff66;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(138, 43, 226, 0.15), transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 30px 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 24px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 15px;
            margin-top: 20px;
            justify-content: center;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .container {
            width: 90%;
            max-width: 800px;
            margin-top: 30px;
            padding-bottom: 50px;
        }

        .section {
            display: none;
            animation: fadeIn 0.4s ease forwards;
        }

        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Cards */
        .rule-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .rule-card:hover {
            transform: translateY(-2px);
            border-color: rgba(255, 255, 255, 0.15);
        }

        .rule-info h3 {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .rule-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .version-tag {
            color: var(--accent-purple);
            background: rgba(138, 43, 226, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        .btn {
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            font-family: 'JetBrains Mono', monospace;
            transition: 0.3s;
        }

        .btn-pass {
            background: rgba(0, 255, 102, 0.1);
            color: var(--success-green);
            border: 1px solid rgba(0, 255, 102, 0.2);
        }
        .btn-pass:hover { background: var(--success-green); color: #000; }

        .btn-fail {
            background: rgba(255, 51, 102, 0.1);
            color: var(--danger-red);
            border: 1px solid rgba(255, 51, 102, 0.2);
        }
        .btn-fail:hover { background: var(--danger-red); color: #fff; box-shadow: 0 0 15px var(--danger-red); }

        /* Modal for Fail Upgrade */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #111;
            border: 1px solid var(--danger-red);
            padding: 30px;
            border-radius: 12px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 0 30px rgba(255, 51, 102, 0.2);
        }

        .modal h2 { margin-bottom: 15px; color: var(--danger-red); font-family: 'JetBrains Mono'; }
        
        textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: 'Poppins';
            resize: none;
            min-height: 80px;
        }

        textarea:focus { outline: none; border-color: var(--accent-cyan); }
        
        .btn-upgrade { background: var(--accent-cyan); color: #000; width: 100%; padding: 12px; }

    </style>
</head>
<body>

    <header>
        <h1>Iterative Protocol</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('lab')">🧪 The Lab (Daily)</button>
            <button class="tab-btn" onclick="switchTab('engine')">📜 Active Rules</button>
            <button class="tab-btn" onclick="switchTab('forge')">♻️ The Forge (Graveyard)</button>
        </div>
    </header>

    <div class="container">
        <!-- THE LAB: Daily Execution -->
        <div id="lab" class="section active">
            <h2 style="margin-bottom: 20px; font-weight: 300; font-size: 18px; color: var(--accent-cyan);">> Today's Execution Test</h2>
            <div id="active-rules-list">
                <!-- Injected via JS -->
            </div>
        </div>

        <!-- RULE ENGINE -->
        <div id="engine" class="section">
            <h2 style="margin-bottom: 20px; font-weight: 300; font-size: 18px;">> System Directives</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Rules currently running in your core logic.</p>
            <div id="engine-list"></div>
        </div>

        <!-- THE FORGE (Graveyard) -->
        <div id="forge" class="section">
            <h2 style="margin-bottom: 20px; font-weight: 300; font-size: 18px; color: var(--danger-red);">> Decompiled Directives</h2>
            <p style="color: var(--text-muted); font-size: 14px; margin-bottom: 20px;">Rules that failed the reality test. Awaiting upgrade.</p>
            <div id="forge-list"></div>
        </div>
    </div>

    <!-- Upgrade Modal -->
    <div class="modal-overlay" id="fail-modal">
        <div class="modal">
            <h2>PROTOCOL FAILURE DETECTED</h2>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 10px;" id="modal-rule-text"></p>
            
            <label style="font-size: 12px; color: var(--accent-cyan);">1. Why did it fail? (Reality Check)</label>
            <textarea id="fail-reason" placeholder="e.g., Distracted, topic changed, tired..."></textarea>
            
            <label style="font-size: 12px; color: var(--accent-purple);">2. Upgrade to Next Version (The Fix)</label>
            <textarea id="new-rule" placeholder="Write the smarter, upgraded rule here..."></textarea>
            
            <button class="btn btn-upgrade" onclick="processUpgrade()">Execute Upgrade (vX.X)</button>
            <button class="btn" style="background: transparent; color: white; width: 100%; margin-top: 10px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Initial Database Mockup
        let rules = [
            {
                id: "C1",
                category: "Communication",
                text: "Listen 70%, Talk 30%.",
                version: "1.0",
                status: "active" // active, failed
            },
            {
                id: "C2",
                category: "Communication",
                text: "Wait for everyone to finish, then summarize and answer.",
                version: "1.0",
                status: "active"
            },
            {
                id: "S1",
                category: "Study",
                text: "Keep phone in another room during NCERT reading.",
                version: "1.0",
                status: "active"
            }
        ];

        let currentFailId = null;

        function renderApp() {
            const labList = document.getElementById('active-rules-list');
            const engineList = document.getElementById('engine-list');
            const forgeList = document.getElementById('forge-list');

            labList.innerHTML = ''; engineList.innerHTML = ''; forgeList.innerHTML = '';

            rules.forEach(rule => {
                if(rule.status === 'active') {
                    // Render for Lab
                    labList.innerHTML += `
                        <div class="rule-card">
                            <div class="rule-info">
                                <h3>${rule.text}</h3>
                                <div class="rule-meta">
                                    <span class="version-tag">v${rule.version}</span>
                                    <span>[${rule.category}]</span>
                                </div>
                            </div>
                            <div class="actions">
                                <button class="btn btn-pass" onclick="alert('Rule Validated. Good job.')">PASS</button>
                                <button class="btn btn-fail" onclick="openFailModal('${rule.id}')">FAIL</button>
                            </div>
                        </div>
                    `;
                    // Render for Engine
                    engineList.innerHTML += `
                        <div class="rule-card" style="border-left: 3px solid var(--accent-cyan);">
                            <div class="rule-info">
                                <h3>${rule.text}</h3>
                                <div class="rule-meta">
                                    <span class="version-tag">v${rule.version}</span>
                                    <span>[${rule.category}]</span>
                                </div>
                            </div>
                        </div>
                    `;
                } else if (rule.status === 'failed') {
                    // Render for Forge
                    forgeList.innerHTML += `
                        <div class="rule-card" style="border-left: 3px solid var(--danger-red); opacity: 0.7;">
                            <div class="rule-info">
                                <h3><del>${rule.text}</del></h3>
                                <div class="rule-meta" style="margin-top: 8px;">
                                    <span style="color: var(--danger-red);">Cause of Death:</span> ${rule.failReason}
                                </div>
                            </div>
                        </div>
                    `;
                }
            });
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function openFailModal(id) {
            currentFailId = id;
            const rule = rules.find(r => r.id === id);
            document.getElementById('modal-rule-text').innerText = `"${rule.text}"`;
            document.getElementById('fail-modal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('fail-modal').style.display = 'none';
            document.getElementById('fail-reason').value = '';
            document.getElementById('new-rule').value = '';
        }

        function processUpgrade() {
            const reason = document.getElementById('fail-reason').value;
            const newText = document.getElementById('new-rule').value;

            if(!reason || !newText) return alert("Fill both fields to upgrade protocol.");

            // 1. Move old rule to failed state
            const oldRuleIndex = rules.findIndex(r => r.id === currentFailId);
            rules[oldRuleIndex].status = 'failed';
            rules[oldRuleIndex].failReason = reason;

            // 2. Create new version
            let oldVer = parseFloat(rules[oldRuleIndex].version);
            let newVer = (oldVer + 0.1).toFixed(1);

            rules.push({
                id: currentFailId + "_upg_" + Date.now(),
                category: rules[oldRuleIndex].category,
                text: newText,
                version: newVer,
                status: 'active'
            });

            closeModal();
            renderApp();
            
            // Switch to Forge to show the dramatic effect
            switchTab('forge');
            document.querySelectorAll('.tab-btn')[2].classList.add('active');
            document.querySelectorAll('.tab-btn')[0].classList.remove('active');
        }

        // Initialize
        renderApp();
    </script>
</body>
</html>
