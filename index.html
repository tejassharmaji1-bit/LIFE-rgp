<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tejas | Command Center v1.1</title>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #050505;
            --card-bg: rgba(20, 20, 25, 0.7);
            --accent-cyan: #00f0ff;
            --accent-purple: #8a2be2;
            --danger-red: #ff3366;
            --success-green: #00ff66;
            --text-main: #e0e0e0;
            --text-muted: #888;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            background-image: radial-gradient(circle at 50% 0%, rgba(138, 43, 226, 0.15), transparent 50%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        header {
            width: 100%;
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
        }

        h1 {
            font-family: 'JetBrains Mono', monospace;
            font-size: 22px;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-purple));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .tab-btn {
            background: transparent;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: var(--text-muted);
            padding: 8px 15px;
            border-radius: 20px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            transition: all 0.3s ease;
        }

        .tab-btn.active {
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .add-rule-btn {
            background: rgba(138, 43, 226, 0.2);
            border: 1px solid var(--accent-purple);
            color: #fff;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            margin: 20px 0;
            width: 100%;
            transition: 0.3s;
        }
        .add-rule-btn:hover {
            background: var(--accent-purple);
            box-shadow: 0 0 15px rgba(138, 43, 226, 0.5);
        }

        .container {
            width: 90%;
            max-width: 600px;
            margin-top: 10px;
            padding-bottom: 50px;
        }

        .section { display: none; animation: fadeIn 0.4s ease forwards; }
        .section.active { display: block; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .rule-card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .rule-info h3 {
            font-size: 14px;
            font-weight: 500;
            margin-bottom: 5px;
        }

        .rule-meta {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: var(--text-muted);
            display: flex;
            gap: 10px;
        }

        .category-tag {
            color: var(--accent-cyan);
            background: rgba(0, 240, 255, 0.1);
            padding: 2px 6px;
            border-radius: 4px;
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        .modal {
            background: #111;
            border: 1px solid var(--accent-purple);
            padding: 25px;
            border-radius: 12px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 0 30px rgba(138, 43, 226, 0.2);
        }

        .modal h2 { margin-bottom: 15px; font-size: 16px; font-family: 'JetBrains Mono'; color: var(--accent-cyan); }
        
        select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-family: 'Poppins';
        }
        
        textarea { resize: none; min-height: 80px; }
        select:focus, textarea:focus { outline: none; border-color: var(--accent-cyan); }
        
        .btn-submit { background: var(--accent-cyan); color: #000; width: 100%; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-cancel { background: transparent; color: #888; width: 100%; padding: 10px; border: none; cursor: pointer; margin-top: 5px; }

        .empty-state { text-align: center; color: var(--text-muted); font-size: 13px; margin-top: 30px; font-family: 'JetBrains Mono'; }
    </style>
</head>
<body>

    <header>
        <h1>Iterative Protocol</h1>
        <div class="nav-tabs">
            <button class="tab-btn active" onclick="switchTab('lab')">🧪 Daily Lab</button>
            <button class="tab-btn" onclick="switchTab('engine')">📜 Active Rules</button>
            <button class="tab-btn" onclick="switchTab('forge')">♻️ Graveyard</button>
        </div>
    </header>

    <div class="container">
        <!-- Add Rule Button -->
        <button class="add-rule-btn" onclick="openAddModal()">+ CREATE NEW RULE</button>

        <!-- THE LAB: Daily Execution -->
        <div id="lab" class="section active">
            <div id="lab-list"></div>
        </div>

        <!-- RULE ENGINE -->
        <div id="engine" class="section">
            <div id="engine-list"></div>
        </div>

        <!-- THE FORGE -->
        <div id="forge" class="section">
            <div id="forge-list"></div>
        </div>
    </div>

    <!-- Create Rule Modal -->
    <div class="modal-overlay" id="add-modal">
        <div class="modal">
            <h2>CREATE NEW RULE</h2>
            
            <label style="font-size: 11px; color: var(--text-muted);">Select Category</label>
            <select id="rule-category">
                <option value="Study">📚 Study</option>
                <option value="Mind">🧠 Mind</option>
                <option value="Exercise">💪 Exercise</option>
                <option value="Schedule">⏱️ Schedule</option>
                <option value="Communication">🗣️ Communication</option>
                <option value="Hair & Skin Care">🧴 Hair or Skin Care</option>
                <option value="Voice">🎙️ Voice</option>
            </select>
            
            <label style="font-size: 11px; color: var(--text-muted);">Define the Rule</label>
            <textarea id="rule-text" placeholder="e.g. Listen 70%, Talk 30%..."></textarea>
            
            <button class="btn-submit" onclick="saveNewRule()">DEPLOY RULE v1.0</button>
            <button class="btn-cancel" onclick="closeAddModal()">Cancel</button>
        </div>
    </div>

    <script>
        // Start with an empty list. No hardcoded rules!
        let rules = [];

        function renderApp() {
            const labList = document.getElementById('lab-list');
            const engineList = document.getElementById('engine-list');
            const forgeList = document.getElementById('forge-list');

            labList.innerHTML = ''; engineList.innerHTML = ''; forgeList.innerHTML = '';

            let hasActive = false;

            rules.forEach(rule => {
                if(rule.status === 'active') {
                    hasActive = true;
                    // Render for Lab
                    labList.innerHTML += `
                        <div class="rule-card" style="border-left: 2px solid var(--accent-purple);">
                            <div class="rule-info">
                                <h3>${rule.text}</h3>
                                <div class="rule-meta">
                                    <span class="category-tag">${rule.category}</span>
                                    <span>v${rule.version}</span>
                                </div>
                            </div>
                        </div>
                    `;
                    // Render for Engine
                    engineList.innerHTML += `
                        <div class="rule-card" style="border-left: 2px solid var(--accent-cyan);">
                            <div class="rule-info">
                                <h3>${rule.text}</h3>
                                <div class="rule-meta">
                                    <span class="category-tag">${rule.category}</span>
                                    <span>v${rule.version}</span>
                                </div>
                            </div>
                        </div>
                    `;
                }
            });

            if(!hasActive) {
                labList.innerHTML = `<div class="empty-state">No rules active. Click '+ CREATE NEW RULE' to start building your system.</div>`;
                engineList.innerHTML = `<div class="empty-state">System empty.</div>`;
            }
            if(forgeList.innerHTML === '') {
                forgeList.innerHTML = `<div class="empty-state">Graveyard is empty. No failed rules yet.</div>`;
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        function openAddModal() {
            document.getElementById('add-modal').style.display = 'flex';
        }

        function closeAddModal() {
            document.getElementById('add-modal').style.display = 'none';
            document.getElementById('rule-text').value = '';
        }

        function saveNewRule() {
            const category = document.getElementById('rule-category').value;
            const text = document.getElementById('rule-text').value;

            if(!text.trim()) {
                alert("Bhai, rule toh likh!");
                return;
            }

            rules.push({
                id: "R_" + Date.now(),
                category: category,
                text: text,
                version: "1.0",
                status: 'active'
            });

            closeAddModal();
            renderApp();
        }

        // Initialize empty state
        renderApp();
    </script>
</body>
</html>
